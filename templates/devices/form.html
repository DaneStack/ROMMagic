{% extends 'base.html' %}

{% block content %}
<div class="form-card">
    <div class="page-header">
        <h1 class="page-title">{{ title }}</h1>
    </div>
    
    <form method="POST">
        <div class="form-group">
            <label for="name" class="form-label">Device Name</label>
            <input type="text" id="name" name="name" class="form-control" value="{{ device.name if device else '' }}" required autofocus>
        </div>
        
        <div class="form-group">
            <button type="submit" class="btn btn-primary">Save Device</button>
            <a href="{{ url_for('devices.index') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
